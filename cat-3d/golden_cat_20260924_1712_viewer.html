<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Viewer · 金渐层</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #101614; }
    model-viewer { width: 100vw; height: 100vh; }
    #tip { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
           color: #9fd8c4; font: 13px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
           letter-spacing: 2px; background: rgba(10,20,18,.72); border: 1px solid rgba(133,240,201,.35);
           padding: 8px 20px; border-radius: 999px; }
  </style>
</head>
<body>
  <model-viewer src="golden_cat_20260924_1712.glb"
    camera-controls auto-rotate auto-rotate-delay="0" shadow-intensity="1"
    exposure="1.1" camera-orbit="30deg 75deg auto">
  </model-viewer>
  <div id="tip">拖动旋转 · 滚轮缩放 · 金渐层 3D 初版</div>
</body>
</html>
